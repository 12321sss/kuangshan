# 智慧矿山平台 · 前端 nginx 配置
#
# 职责：① 托管前端静态文件（含 Cesium 资源） ② 反代 /api 与 /sentinel
# 这份配置替代了开发期的 vite proxy，路径规则必须与 frontend/vite.config.ts 一致：
#   /api/*        → backend，**保留** /api 前缀
#   /sentinel/*   → inference，**剥掉** /sentinel 前缀（前端 axios 的 baseURL 是 /sentinel）

upstream rs_backend {
    server backend:8080;
    keepalive 32;
}

upstream rs_inference {
    server inference:8010;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 高分影像单景 100–800MB：Spring 侧已放到 2GB，nginx 默认 1MB 会先拦下来（413）
    client_max_body_size 2048m;
    client_body_timeout 1800s;
    client_body_buffer_size 1m;

    # 容器健康检查用（不依赖后端是否就绪）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- 静态资源缓存策略 ----
    # 带 hash 的构建产物：长缓存
    # 注意：这里不要再写 add_header，否则 server 级的安全头会因继承被覆盖而丢失
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }
    # Cesium 目录文件名固定（Cesium.js 等），升级后必须能拿到新版本，给短缓存
    location /cesium/ {
        expires 1d;
        try_files $uri =404;
    }
    # 瓦片/模型等大二进制：关掉 gzip（压不动还占 CPU）
    location ~* \.(glb|gltf|b3dm|pnts|terrain|png|jpg|jpeg|webp|tif|tiff)$ {
        gzip off;
        expires 7d;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/wasm;

    # ---- 后端健康检查：精确匹配优先于 /api/ 前缀 ----
    # 只转发到 actuator/health（该端点只返回 {"status":"UP"}，不含细节）
    location = /api/health {
        access_log off;
        proxy_pass http://rs_backend/actuator/health;
    }

    # ---- 业务接口：/api → backend（保留前缀） ----
    location /api/ {
        proxy_pass http://rs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件直接透传，不在 nginx 落盘（省磁盘、少一次拷贝）
        proxy_request_buffering off;
        proxy_buffering off;
        # 上传 + 解译提交的等待时间；默认 60s 会让 300MB 的上传中途 504
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # ---- 解译服务：/sentinel → inference（剥前缀） ----
    location /sentinel/ {
        # 结尾的斜杠是关键：有它才会把 location 匹配到的 /sentinel/ 替换掉
        proxy_pass http://rs_inference/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 在线拉景（AWS STAC）首次要下瓦片，给到 15 分钟
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # ---- SPA 回退：前端是 history 路由，刷新子路径不能 404 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 基础安全头 ----
    # 不设 CSP：Cesium + 天地图 + blob worker 的 CSP 很难一次配对，配错整页白屏，
    # 真要上 CSP 建议先只在报告页/管理页灰度。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 上传目录、数据目录不在 root 下，不会被静态 serve；这里额外挡一下常见探测路径
    location ~ ^/(data|\.git|\.env) {
        return 404;
    }
}
