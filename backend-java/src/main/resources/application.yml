server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: rs-platform-backend
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      # 高分影像（GF-2 等）单景通常 100-800MB，不放开会被默认 1MB 拦掉，
      # 前端表现为「上传无反应」或 413。上限 2GB。
      max-file-size: 2GB
      max-request-size: 2GB
      # 大文件传输耗时长，给足超时
      file-size-threshold: 2MB
  # 业务库 MySQL（数据中台业务侧；空间库 PostGIS 部署到服务器后接入）
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rs_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update   # demo 期由实体自动建表；生产切换为 Flyway 迁移管理
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

# 应用自定义配置：全部走环境变量，默认值仅供本机开发
app:
  jwt:
    # 生产环境必须注入 JWT_SECRET，HS256 要求密钥 >= 32 字节
    secret: ${JWT_SECRET:dev-only-secret-key-do-not-use-in-prod-0123456789abcdef}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: 7
